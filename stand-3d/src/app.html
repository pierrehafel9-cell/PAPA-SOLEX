<title>Stand Flora &amp; Co</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : atelier de maquettiste — panneau de travail à gauche, maquette 3D à droite, cotes en chiffres mono */
:root {
  --bg: #ece7e3;
  --surface: #faf8f6;
  --surface-2: #f2ede9;
  --ink: #2a211d;
  --muted: #73665d;
  --line: #dcd2ca;
  --accent: #6d2131;
  --accent-ink: #ffffff;
  --camel: #9c6634;
  --ok: #2e7550;
  --warn: #9a5c00;
  --bad: #b3261e;
  --ok-bg: #e3efe7;
  --warn-bg: #f6ead6;
  --bad-bg: #f7e2df;
  --f-display: "Marcellus", "Didot", "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161211; --surface: #201a18; --surface-2: #2a2220; --ink: #f0e7e1; --muted: #a8988e; --line: #3b312d;
    --accent: #e3909f; --accent-ink: #26090f; --camel: #dba56f; --ok: #73c995; --warn: #eaa848; --bad: #f2867c;
    --ok-bg: #1d2e24; --warn-bg: #33270f; --bad-bg: #3a1c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161211; --surface: #201a18; --surface-2: #2a2220; --ink: #f0e7e1; --muted: #a8988e; --line: #3b312d;
  --accent: #e3909f; --accent-ink: #26090f; --camel: #dba56f; --ok: #73c995; --warn: #eaa848; --bad: #f2867c;
  --ok-bg: #1d2e24; --warn-bg: #33270f; --bad-bg: #3a1c1a; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
  grid-template-areas: "panel stage";
  gap: 12px;
  padding: 12px 16px;
}
.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; border-radius: var(--r); overflow: hidden; background: #d9d4cf; border: 1px solid var(--line); }
.view { position: absolute; inset: 0; touch-action: none; }
.view canvas { display: block; width: 100%; height: 100%; }
.panel { grid-area: panel; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "panel"; }
  .stage { height: 60vh; min-height: 340px; }
  .panel { overflow: visible; }
  .panes { overflow: visible !important; }
}

/* Brand */
.brand { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 22px; letter-spacing: .02em; margin: 0; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

/* Contrôles */
.checks { padding: 10px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.kpi { border-radius: 8px; padding: 6px 8px; background: var(--surface-2); border: 1px solid transparent; min-width: 0; }
.kpi .k { display: block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.kpi .v { display: block; font-family: var(--f-mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.ok { background: var(--ok-bg); } .kpi.ok .v { color: var(--ok); }
.kpi.bad { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 35%, transparent); } .kpi.bad .v { color: var(--bad); }
.kpi.warn { background: var(--warn-bg); } .kpi.warn .v { color: var(--warn); }
.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 120px; overflow: auto; }
.issues li { font-size: 12.5px; padding: 4px 8px; border-radius: 6px; display: flex; gap: 6px; align-items: baseline; }
.issues li::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; transform: translateY(-1px); }
.issues li.bad { color: var(--bad); background: var(--bad-bg); }
.issues li.warn { color: var(--warn); background: var(--warn-bg); }
.issues li.ok { color: var(--ok); background: var(--ok-bg); }

/* Onglets */
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; border: 0; background: none; padding: 8px 10px 9px; font-weight: 600; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panes { flex: 1; min-height: 0; overflow: auto; }
.pane { padding: 14px 16px 22px; display: grid; gap: 16px; align-content: start; }
.pane h2 { font-family: var(--f-display); font-weight: 400; font-size: 17px; margin: 0; letter-spacing: .02em; }
.pane h3 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
.lead { margin: 0; color: var(--muted); font-size: 13px; }
.group { display: grid; gap: 8px; }

/* Catalogue */
.cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.cat button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.cat button:hover { border-color: var(--accent); }
.cat .n { font-weight: 600; font-size: 13px; line-height: 1.25; }
.cat .d { font-family: var(--f-mono); font-size: 11.5px; color: var(--camel); font-variant-numeric: tabular-nums; }
.cat .p { font-size: 11.5px; color: var(--muted); }


/* Formulaires */
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px 10px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label, .lbl { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.field input[type="number"], .field input[type="text"], .field select, textarea {
  width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
}
.field input[type="number"] { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
textarea { font-family: var(--f-mono); font-size: 11.5px; min-height: 80px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 11px; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 8px; font-size: 12px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.chip { display: inline-block; font-family: var(--f-mono); font-size: 12px; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }

/* Liste des éléments */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.list button { width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.list button:hover { background: var(--surface-2); }
.list button[aria-current="true"] { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
.list .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .dm { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.list .flag { color: var(--bad); font-weight: 700; }

/* Modèles */
.presets { display: grid; gap: 8px; }
.preset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.preset strong { font-weight: 600; font-size: 13.5px; }
.preset p { margin: 0; font-size: 12.5px; color: var(--muted); }

/* Photos */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.photos button { border: 0; padding: 0; background: none; text-align: left; display: grid; gap: 4px; }
.photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block; }
.photos span { font-size: 12px; color: var(--muted); }

/* Barre de vues + sélection */
.vbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; }
.vbar button { pointer-events: auto; border: 0; border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.88); color: #2a211d; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.vbar button[aria-pressed="true"] { background: #6d2131; color: #fff; }
.selbar { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; pointer-events: none; }
.selbar > * { pointer-events: auto; }
.selbar .nm { background: rgba(42,33,29,.88); color: #fff; padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.selbar button { border: 0; border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.92); color: #2a211d; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.selbar button.del { color: #b3261e; }
.hint { position: absolute; left: 12px; bottom: 12px; margin: 0; font-size: 11.5px; color: #3d3430; background: rgba(255,255,255,.75); padding: 4px 8px; border-radius: 6px; max-width: calc(100% - 24px); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; color: #3d3430; }

/* Fenêtre */
.modal { position: fixed; inset: 0; background: rgba(15,10,8,.72); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal .box { background: var(--surface); border-radius: var(--r); padding: 14px; max-width: min(1100px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 10px; }
.modal img { max-width: 100%; max-height: 72vh; border-radius: 6px; display: block; margin: 0 auto; }
.modal .row { justify-content: space-between; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">

</div>

  </div>
</div>

/* ---------- Géométrie 2D ---------- */
function corners(it) {
  const c = Math.cos(it.rot * DEG), s = Math.sin(it.rot * DEG), hw = it.w / 200, hd = it.d / 200;

}

}
function obbOverlap(a, b, tol = 0.01) {
  const A = corners(a), B = corners(b);
  for (const poly of [A, B]) {
    for (let i = 0; i < 2; i++) {
      const p = poly[i], q = poly[i + 1];
      const ax = -(q[1] - p[1]), az = q[0] - p[0];
      const len = Math.hypot(ax, az) || 1;
      const nx = ax / len, nz = az / len;
      const pa = A.map(v => v[0] * nx + v[1] * nz), pb = B.map(v => v[0] * nx + v[1] * nz);
      if (Math.max(...pa) - tol <= Math.min(...pb) || Math.max(...pb) - tol <= Math.min(...pa)) return false;
    }
  }
  return true;
}

function settle(it, pool = state.items, exclude = null) {

  let e = 0;
  for (const o of pool) {
    if (o === it || (exclude && exclude.has(o)) || !canHold(o)) continue;
    if (!inside(it.x, it.z, o, -0.005)) continue;

}

  const lp = makeLabel(`Passage chariots ${fmt(pl)} m`, { fg: '#6b4300', bg: 'rgba(255,246,228,0.92)', size: 0.15, onTop: false });
  lp.position.set(cx - s.w / 2 - 0.1, 0.12, f0 + pl / 2); lp.center.set(1, 0.5); standGroup.add(lp);
  const lw = makeLabel(`${fmt(s.w)} m`, { size: 0.15, onTop: false }); lw.position.set(cx, 0.1, R.z1 + 0.18); standGroup.add(lw);
  const ld = makeLabel(`${fmt(s.d)} m`, { size: 0.15, onTop: false }); ld.position.set(R.x1 + 0.12, 0.1, cz); ld.center.set(0, 0.5); standGroup.add(ld);
  // Limite de hauteur
  limitGroup = new THREE.Group();
  const lim = plane(s.w, s.d, new THREE.MeshBasicMaterial({ color: '#c0392b', transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false }));
  lim.rotation.x = -Math.PI / 2; lim.position.set(cx, LIMIT_H / 100, cz); lim.userData.noPick = true; limitGroup.add(lim);
  limitGroup.add(dashedRect(R.x0, R.z0, R.x1, R.z1, LIMIT_H / 100, '#c0392b', 0.08));
  for (const [x, z] of [[R.x0, R.z0], [R.x1, R.z0], [R.x1, R.z1], [R.x0, R.z1]]) {
    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, 0, z), new THREE.Vector3(x, LIMIT_H / 100, z)]);
    const l = new THREE.Line(g, new THREE.LineDashedMaterial({ color: '#c0392b', dashSize: 0.06, gapSize: 0.05, transparent: true, opacity: 0.6 }));
    l.computeLineDistances(); limitGroup.add(l);
  }
  const ll = makeLabel('1,50 m max', { fg: '#ffffff', bg: 'rgba(179,38,30,0.9)', size: 0.13 });
  ll.position.set(R.x1, LIMIT_H / 100 + 0.08, R.z1); limitGroup.add(ll);
  limitGroup.visible = state.opts.limit;
  standGroup.add(limitGroup);
  // Ombres centrées sur le stand
  sun.position.set(cx + 2.5, 7, cz + 3.5); sun.target.position.set(cx, 0, cz);
}

/* ---------- Construction des meubles ---------- */
let bagGeo = null, handleGeo = null, claspGeo = null;
const BAG_H = 0.30;
function makeBag(hex, s = 1) {
  if (!bagGeo) {
    const sh = new THREE.Shape();
    sh.moveTo(-0.14, 0.01); sh.lineTo(0.14, 0.01); sh.lineTo(0.115, 0.21); sh.lineTo(-0.115, 0.21); sh.closePath();
    bagGeo = new THREE.ExtrudeGeometry(sh, { depth: 0.1, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 2, curveSegments: 1 });
    bagGeo.translate(0, 0, -0.05);
    handleGeo = new THREE.TorusGeometry(0.075, 0.008, 6, 20, Math.PI);
    claspGeo = new THREE.BoxGeometry(0.05, 0.028, 0.01);
  }
  const g = new THREE.Group();
  const m = bagMat(hex);
  const body = new THREE.Mesh(bagGeo, m); body.castShadow = true; g.add(body);
  const h = new THREE.Mesh(handleGeo, m); h.position.y = 0.215; g.add(h);
  const c = new THREE.Mesh(claspGeo, mat('dore')); c.position.set(0, 0.16, 0.063); g.add(c);
  g.scale.setScalar(s);
  return g;
}

function buildItem(it) {
  // meubles de base : même construction que le type générique, selon leur forme
  if (CATALOG[it.type] && CATALOG[it.type].shape) it = Object.assign({}, it, { type: 'custom', params: Object.assign({ shape: CATALOG[it.type].shape }, it.params) });
  const g = new THREE.Group();
  const w = it.w / 100, d = it.d / 100, h = it.h / 100;
  const m = mat(it.color);
  const bags = new THREE.Group(); g.add(bags);
  let nBags = 0, bagTop = 0;
  const addBag = (x, y, z, s = 1, ry = 0) => {
    const b = makeBag(BAG_COLORS[(it.id * 5 + nBags * 3) % BAG_COLORS.length], s);
    b.position.set(x, y, z); b.rotation.y = ry; bags.add(b);
    nBags++; bagTop = Math.max(bagTop, y + BAG_H * s);
  };
  const box = (bw, bh, bd, mm, x, y, z) => {
    const o = new THREE.Mesh(new THREE.BoxGeometry(Math.max(bw, 0.001), Math.max(bh, 0.001), Math.max(bd, 0.001)), mm);
    o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; g.add(o); return o;
  };
  const cyl = (r1, r2, ch, mm, x, y, z, seg = 18) => {
    const o = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, ch, seg), mm);
    o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; g.add(o); return o;
  };
  const fit = n => Math.max(0, n);
  const hookRows = (top, low, rows) => {
    const ys = [];
    if (top < low) return ys;
    const maxRows = Math.floor((top - low) / (BAG_H + 0.04)) + 1;
    const n = Math.min(rows, maxRows);
    const step = n > 1 ? Math.min((top - low) / (n - 1), 0.5) : 0;
    for (let i = 0; i < n; i++) ys.push(top - i * step);
    return ys;
  };
  const moulures = (faceZ, dir, x0, x1, y0, y1, mm) => {
    const n = Math.max(1, Math.round((x1 - x0) / 1.0));
    const pw = (x1 - x0) / n;
    for (let i = 0; i < n; i++) {
      const a = x0 + i * pw + 0.07, b = x0 + (i + 1) * pw - 0.07, t = 0.022, zz = faceZ + dir * 0.008;
      box(b - a, t, 0.012, mm, (a + b) / 2, y1 - 0.07, zz);
      box(b - a, t, 0.012, mm, (a + b) / 2, y0 + 0.07, zz);
      box(t, y1 - y0 - 0.14, 0.012, mm, a, (y0 + y1) / 2, zz);
      box(t, y1 - y0 - 0.14, 0.012, mm, b, (y0 + y1) / 2, zz);
    }
  };
  const logoPlane = (pw, ph, x, y, z, ry = 0) => {
    const tex = logoTex(PALETTE[it.color] ? PALETTE[it.color].color : '#262221');
    const mm = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }); mm.userData.own = true;
    const o = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), mm); o.position.set(x, y, z); o.rotation.y = ry; g.add(o);
  };

  if (it.type === 'custom' && (it.params.shape === 'portant' || it.params.shape === 'panneau' || it.params.shape === 'caisse')) {
    const alias = { portant: ['rail', { bars: 1, spacing: 16 }], panneau: ['wall', { faces: 1, rows: 3, spacing: 34 }], caisse: ['crate', {}] }[it.params.shape];
    return buildItem(Object.assign({}, it, { type: alias[0], params: alias[1] }));
  }
  switch (it.type) {
    case 'custom': {
      const shape = it.params.shape;
      if (shape === 'bloc') {
        box(w, h, d, m, 0, h / 2, 0);
        const n = Math.max(1, Math.floor(w / 0.34));
        for (let i = 0; i < n; i++) addBag(-((n - 1) * 0.34) / 2 + i * 0.34, h, 0, Math.min(1, Math.max(0.6, (w - 0.04) / 0.3)));
      } else if (shape === 'table') {
        box(w, 0.03, d, m, 0, h - 0.015, 0);
        for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(0.04, h - 0.03, 0.04, m, sx * (w / 2 - 0.04), (h - 0.03) / 2, sz * (d / 2 - 0.04));
        const n = Math.max(1, Math.floor(w / 0.34));
        for (let i = 0; i < n; i++) addBag(-((n - 1) * 0.34) / 2 + i * 0.34, h, 0, 1);
      } else {
        // étagère ouverte : côtés, dos, N plateaux, sacs sur chaque niveau
        const t = 0.018, N = Math.max(1, +it.params.shelves || 3);
        box(t, h, d, m, -w / 2 + t / 2, h / 2, 0); box(t, h, d, m, w / 2 - t / 2, h / 2, 0);
        box(w, h, 0.008, mat(it.color, { shade: 0.12 }), 0, h / 2, -d / 2 + 0.004);
        const gap = (h - t) / N;
        for (let k = 0; k <= N; k++) box(w - 2 * t, t, d, m, 0, Math.min(k * gap + t / 2, h - t / 2), 0);
        const s = Math.min(1, (gap - t - 0.02) / BAG_H, (d - 0.02) / 0.13);
        const n = Math.max(1, Math.floor((w - 2 * t) / 0.34));
        if (s > 0.3) for (let k = 0; k < N; k++) for (let i = 0; i < n; i++) addBag(-((n - 1) * 0.34) / 2 + i * 0.34, k * gap + t, 0, s);
      }
      break;
    }
    case 'rail': {
      const r = 0.012;
      for (const sx of [-1, 1]) { const px = sx * (w / 2 - r); cyl(r, r, h, m, px, h / 2, 0, 10); box(0.03, 0.02, d, m, px, 0.01, 0); }
      const ys = [h - 0.03];
      if (+it.params.bars === 2 && h >= 1.05) ys.push(h - 0.03 - 0.6);
      const sp = Math.max(0.08, (+it.params.spacing || 16) / 100);
      for (const y of ys) {
        const bar = cyl(r, r, w, m, 0, y, 0, 10); bar.rotation.z = Math.PI / 2;
        const n = fit(Math.floor((w - 0.1) / sp));
        for (let i = 0; i < n; i++) addBag(-((n - 1) * sp) / 2 + i * sp, y - BAG_H, 0, 1, 1.3);
      }
      break;
    }
    case 'wall': case 'peg': case 'panel': {
      const faces = it.type === 'panel' ? 1 : (+it.params.faces || 1);
      const t = it.type === 'peg' ? 0.018 : 0.03;
      const base = it.type === 'peg' ? 0.12 : 0.06;
      const panelZ = faces === 2 ? 0 : -d / 2 + t / 2 + (it.type === 'peg' ? 0.02 : 0);
      let pm = m;
      if (it.type === 'peg') {
        const tex = holesBase.clone(); tex.needsUpdate = true; tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(w / 0.05, (h - base) / 0.05);
        pm = new THREE.MeshStandardMaterial({ color: new THREE.Color(PALETTE[it.color].color), map: tex, roughness: .75, envMapIntensity: .5 });
        pm.userData.own = true;
        for (const sx of [-1, 1]) { box(0.04, h, 0.04, m, sx * (w / 2 - 0.02), h / 2, panelZ); box(0.05, 0.035, d, m, sx * (w / 2 - 0.02), 0.0175, 0); }
      } else {
        box(w, base, d, mat(it.color, { shade: 0.25 }), 0, base / 2, 0);
      }
      box(it.type === 'peg' ? w - 0.08 : w, h - base, t, pm, 0, base + (h - base) / 2, panelZ);
      if (it.type === 'wall') box(w, 0.025, Math.min(d, 0.07), mat('dore'), 0, h - 0.0125, panelZ);
      for (let f = 0; f < faces; f++) {
        const dir = f === 0 ? 1 : -1;
        const faceZ = panelZ + dir * t / 2;
        if (it.params.moulures) moulures(faceZ, dir, -w / 2 + 0.02, w / 2 - 0.02, base, h - 0.03, mat(it.color, { tint: 0.35 }));
        if (it.type === 'panel') {
          if (it.params.logo) logoPlane(Math.min(w * 0.75, 1.0), Math.min(w * 0.75, 1.0) / 4, 0, h * 0.72, faceZ + dir * 0.016, f ? Math.PI : 0);
          continue;
        }
        const sp = Math.max(0.2, (+it.params.spacing || 34) / 100);
        const n = fit(Math.floor((w - 0.06) / sp));
        const ys = hookRows(h - 0.08, base + 0.06 + BAG_H, +it.params.rows || 3);
        for (const y of ys) for (let i = 0; i < n; i++) {
          const x = -((n - 1) * sp) / 2 + i * sp;
          const peg = cyl(0.004, 0.004, 0.07, mat('dore'), x, y, faceZ + dir * 0.035, 6); peg.rotation.x = Math.PI / 2;
          addBag(x, y - BAG_H + 0.01, faceZ + dir * 0.075, 1, f ? Math.PI : 0);
        }
      }
      if (it.type === 'panel') for (const sx of [-1, 1]) box(0.05, 0.04, d, m, sx * (w / 2 - 0.05), 0.02, 0);
      break;
    }
    case 'ladder': {
      const tilt = Math.atan2(d - 0.06, h);
      const L = Math.hypot(h, d - 0.06);
      for (const sx of [-1, 1]) { const rail = box(0.04, L, 0.04, m, sx * (w / 2 - 0.02), h / 2, 0); rail.rotation.x = -tilt; }
      for (let y = 0.3; y <= h - 0.12; y += 0.3) {
        const z = (d / 2 - 0.03) - (y / h) * (d - 0.06);
        const rung = cyl(0.014, 0.014, w - 0.06, m, 0, y, z, 10); rung.rotation.z = Math.PI / 2;
        if (y - BAG_H >= 0.04) {
          if (w >= 0.6) { addBag(-w / 4, y - BAG_H, z + 0.07, 0.95); addBag(w / 4, y - BAG_H, z + 0.07, 0.95); }
          else addBag(0, y - BAG_H, z + 0.07, Math.min(1, (w - 0.02) / 0.3));
        }
      }
      break;
    }
    case 'kallax': {
      const cols = +it.params.cols || 2, rows = +it.params.rows || 2, T = 0.038, t = 0.016;
      box(T, h, d, m, -w / 2 + T / 2, h / 2, 0); box(T, h, d, m, w / 2 - T / 2, h / 2, 0);
      box(w, T, d, m, 0, T / 2, 0); box(w, T, d, m, 0, h - T / 2, 0);
      const cw = (w - 2 * T - (cols - 1) * t) / cols, ch = (h - 2 * T - (rows - 1) * t) / rows;
      for (let c = 1; c < cols; c++) box(t, h - 2 * T, d, m, -w / 2 + T + c * cw + (c - 1) * t + t / 2, h / 2, 0);
      for (let r = 1; r < rows; r++) box(w - 2 * T, t, d, m, 0, T + r * ch + (r - 1) * t + t / 2, 0);
      const s = Math.min(1, (cw - 0.03) / 0.31, (ch - 0.03) / BAG_H);
      for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) addBag(-w / 2 + T + c * (cw + t) + cw / 2, T + r * (ch + t), 0, s);
      break;
    }
    case 'crate': {
      const t = 0.012;
      box(w, t, d, m, 0, t / 2, 0); box(w, t, d, m, 0, h - t / 2, 0);
      box(t, h, d, m, -w / 2 + t / 2, h / 2, 0); box(t, h, d, m, w / 2 - t / 2, h / 2, 0);
      box(w, h, t, mat(it.color, { shade: 0.15 }), 0, h / 2, -d / 2 + t / 2);
      const s = Math.min(1, (w - 0.05) / 0.31, (h - 2 * t - 0.02) / BAG_H, (d - 0.02) / 0.13);
      if (s > 0.35) addBag(0, t, 0.005, s);
      break;
    }
    case 'cube': case 'storage': {
      box(w, h, d, m, 0, h / 2, 0);
      if (it.type === 'storage') {
        box(0.004, h - 0.04, 0.004, mat(it.color, { shade: 0.4 }), 0, h / 2, d / 2 + 0.002);
        for (const sx of [-1, 1]) cyl(0.008, 0.008, 0.02, mat('dore'), sx * 0.04, h * 0.6, d / 2 + 0.01, 8).rotation.x = Math.PI / 2;
      } else {
        const n = Math.max(1, Math.floor(w / 0.34));
        const s = Math.min(1, Math.max(0.6, (w - 0.04) / 0.3));
        for (let i = 0; i < n; i++) addBag(-((n - 1) * 0.34) / 2 + i * 0.34, h, 0, s);
      }
      break;
    }
    case 'steps': {
      const N = +it.params.steps || 3, sd = d / N;
      for (let i = 0; i < N; i++) {
        const sh = h * (i + 1) / N, z = d / 2 - sd * (i + 0.5);
        box(w, sh, sd, m, 0, sh / 2, z);
        const n = Math.max(1, Math.floor(w / 0.34));
        for (let k = 0; k < n; k++) addBag(-((n - 1) * 0.34) / 2 + k * 0.34, sh, z, sd < 0.2 ? 0.8 : 1);
      }
      break;
    }
    case 'bust': {
      cyl(Math.min(w, d) / 2 - 0.01, Math.min(w, d) / 2, 0.02, m, 0, 0.01, 0);
      cyl(0.012, 0.012, h - 0.03, m, 0, (h - 0.03) / 2, 0, 10);
      const bar = cyl(0.01, 0.01, 0.22, m, 0, h - 0.03, 0, 8); bar.rotation.z = Math.PI / 2;
      addBag(0, h - 0.03 - BAG_H, 0.04, 1);
      break;
    }
    case 'counter': {
      box(w, h - 0.03, d - 0.04, m, 0, (h - 0.03) / 2, -0.02);
      box(w + 0.02, 0.03, d, mat('creme', { tint: 0.2 }), 0, h - 0.015, 0);
      box(w, 0.06, d - 0.06, mat(it.color, { shade: 0.35 }), 0, 0.03, -0.03);
      if (it.params.logo) logoPlane(Math.min(w * 0.7, 0.9), Math.min(w * 0.7, 0.9) / 4, 0, h * 0.6, d / 2 - 0.04 + 0.002);
      box(0.11, 0.07, 0.16, mat('noir'), w / 2 - 0.18, h + 0.035, -0.08);
      box(0.2, 0.08, 0.15, mat('bordeaux'), -w / 2 + 0.18, h + 0.04, -0.05);
      box(0.14, 0.06, 0.1, mat('creme'), -w / 2 + 0.18, h + 0.11, -0.05);
      break;
    }
    case 'console': {
      box(w, 0.03, d, m, 0, h - 0.015, 0);
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(0.03, h - 0.03, 0.03, m, sx * (w / 2 - 0.03), (h - 0.03) / 2, sz * (d / 2 - 0.03));
      box(w - 0.06, 0.02, d - 0.06, m, 0, 0.14, 0);
      const n = Math.max(1, Math.floor(w / 0.36));
      for (let i = 0; i < n; i++) addBag(-((n - 1) * 0.36) / 2 + i * 0.36, h, 0, 1);
      if (h - 0.18 > BAG_H + 0.05) for (let i = 0; i < n; i++) addBag(-((n - 1) * 0.36) / 2 + i * 0.36, 0.15, 0, 0.9);
      break;
    }
    case 'table': {
      cyl(w / 2, w / 2, 0.03, m, 0, h - 0.015, 0, 36);
      cyl(0.025, 0.025, h - 0.03, m, 0, (h - 0.03) / 2, 0, 12);
      cyl(w / 4, w / 4 + 0.01, 0.02, m, 0, 0.01, 0, 28);
      if (w >= 0.7) { addBag(-0.16, h, 0, 1, 0.3); addBag(0.16, h, 0.02, 0.9, -0.3); } else addBag(0, h, 0, Math.min(1, w / 0.4));
      break;
    }
    case 'gate': {
      for (const sx of [-1, 1]) box(0.04, h, Math.max(d, 0.04), m, sx * (w / 2 - 0.02), h / 2, 0);
      box(w - 0.08, 0.04, 0.03, m, 0, h - 0.06, 0); box(w - 0.08, 0.04, 0.03, m, 0, 0.12, 0);
      const n = Math.max(2, Math.round((w - 0.08) / 0.09));
      for (let i = 0; i < n; i++) box(0.025, h - 0.22, 0.02, m, -(w - 0.08) / 2 + (i + 0.5) * (w - 0.08) / n, h / 2 + 0.03, 0);
      box(0.05, 0.03, 0.04, mat('dore'), w / 2 - 0.06, h * 0.62, 0.03);
      break;
    }
    case 'mirror': {
      box(w, 0.03, d, m, 0, 0.015, 0);
      for (const sx of [-1, 1]) box(0.025, 0.12, 0.025, m, sx * (w / 2 - 0.03), 0.06, 0);
      box(w, h - 0.12, 0.03, m, 0, 0.12 + (h - 0.12) / 2, 0);
      const gl = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.06, h - 0.18), mirrorMat);
      gl.position.set(0, 0.12 + (h - 0.12) / 2, 0.0155); g.add(gl);
      break;
    }
    case 'rug': {
      const o = new THREE.Mesh(new THREE.BoxGeometry(w, 0.008, d), mat(it.color, { tint: 0.05 }));
      o.position.y = 0.004; o.receiveShadow = true; g.add(o);
      break;
    }
    case 'tree': {
      const pot = h * 0.2;
      cyl(Math.min(w, d) * 0.22, Math.min(w, d) * 0.18, pot, m, 0, pot / 2, 0, 20);
      cyl(0.025, 0.03, h * 0.15, mat('chene'), 0, pot + h * 0.06, 0, 8);
      const green = new THREE.MeshStandardMaterial({ color: '#2e4a3b', roughness: .9 });
      const lev = [[0.5, 0.42], [0.38, 0.62], [0.24, 0.8]];
      lev.forEach(([r, y], i) => { const cone = new THREE.Mesh(new THREE.ConeGeometry(Math.min(w, d) * r, h * 0.38, 20), green); cone.position.y = h * y - h * 0.08 + (i ? 0 : 0.02); cone.castShadow = true; g.add(cone); });
      const rr = rng(it.id * 13);
      for (let i = 0; i < 12; i++) {
        const a = rr() * Math.PI * 2, y = pot + 0.08 + rr() * (h - pot - 0.2), rad = Math.min(w, d) * 0.5 * (1 - (y - pot) / (h - pot)) * 0.95;
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.018, 10, 8), mat('dore')); b.position.set(Math.cos(a) * rad, y, Math.sin(a) * rad); g.add(b);
      }
      break;
    }
    case 'cart': {
      const blue = new THREE.MeshStandardMaterial({ color: '#2456c9', roughness: .5, metalness: .2, transparent: true, opacity: 0.75 });
      box(w, 0.42, d * 0.72, blue, 0, 0.74, 0.04);
      box(w * 0.75, 0.03, d * 0.85, blue, 0, 0.16, 0);
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        cyl(0.05, 0.05, 0.03, mat('noir'), sx * (w / 2 - 0.08), 0.05, sz * (d / 2 - 0.1), 12).rotation.z = Math.PI / 2;

function computeChecks() {

    const top = it.elev + it.h;

  }
  for (const it of inStand) {
    if (it.type === 'rug') continue;

    const st = statsById.get(it.id);
    if (st && st.bags && state.opts.bags) maxBag = Math.max(maxBag, it.elev + st.bagTop * 100);
    if (top > LIMIT_H + 0.4) issues.push(['bad', `${it.name} monte à ${Math.round(top)} cm (limite ${LIMIT_H} cm)`, it.id]);
  }

  if (facade.length) issues.push(['warn', `Mur de sacs sur la vitrine : faire valider sa hauteur (${fmt(state.env.wallLimit)} m) par la galerie`]);

  $('#sFit').onclick = () => { standChange(() => { state.stand.d = Math.floor(600 / state.stand.w) / 100; })(); renderStandPane(); };

  $('#eA').addEventListener('input', () => { const v = num('eA'); if (!v || v < 4) return; state.env.aisle = v; buildEnv(); save(); });
  $('#eW').addEventListener('input', () => { const v = num('eW'); if (!v || v < 0.5) return; state.env.wallLimit = v; renderChecks(); save(); });
  $('#oBags').onchange = ev => { state.opts.bags = ev.target.checked; for (const [, g] of objById) g.userData.bagGroup.visible = state.opts.bags; renderChecks(); save(); };

  $('#oCeil').onchange = ev => { state.opts.ceiling = ev.target.checked; save(); };
  $('#oSnap').onchange = ev => { state.opts.snap = ev.target.checked; save(); };
}

  const F = (type, x, z, rot, over = {}) => makeItem(type, Object.assign({}, over, { x, z, rot }));
  // le mur de sacs remplace la bâche bleue de la vitrine
  state.items.push(F('wall', 0, 0.15, 0, { w: Math.round(state.env.banner * 100), h: Math.round(state.env.wallLimit * 100), color: p.wallColor || 'noir', name: 'Mur de sacs (à la place de la bâche)', params: { faces: 1, rows: 5, spacing: 34, moulures: !!p.wallMoulures } }));
  for (const it of p.items(S, F)) { state.items.push(it); settle(it); }
  const facadeFront = Math.max(0, ...state.items.filter(isFacade).map(i => bounds(i).z1));
  state.items.push(makeItem('cart', { x: st.x + 0.9, z: facadeFront + (st.passage - facadeFront) / 2, rot: 90 }));
  state.items.push(makeItem('person', { x: st.x - st.w / 2 - 0.45, z: st.passage + st.d + 0.45, rot: 180 }));
  selectedId = null;
  buildStand(); rebuildAll(); select(null); refresh(); save();
  renderStandPane();
  setView(viewMode === 'plan' ? 'plan' : '3d');
}

function readSlots() { try { return JSON.parse(localStorage.getItem(SLOTS_KEY) || '[]'); } catch (_) { return []; } }
function writeSlots(a) { try { localStorage.setItem(SLOTS_KEY, JSON.stringify(a)); return true; } catch (_) { return false; } }
let pendingPreset = null;
function renderModelsPane() {
  const slots = readSlots();
  $('#paneModels').innerHTML = `
    <div class="group"><h2>Modèles de stand</h2><p class="lead">Chaque modèle respecte 6 m², 1,50 m de haut et le passage chariots. Chargez-en un, puis modifiez-le.</p>
      <div class="presets">${PRESETS.map(p => `<div class="preset"><strong>${esc(p.name)}</strong><p>${esc(p.desc)}</p><div class="row">${pendingPreset === p.key
        ? `<span class="note">Remplacer la maquette actuelle ?</span><button type="button" class="btn small primary" data-ok="${p.key}">Oui, charger</button><button type="button" class="btn small" data-cancel>Annuler</button>`
        : `<button type="button" class="btn small" data-preset="${p.key}">Charger ce modèle</button>`}</div></div>`).join('')}</div>
    </div>
    <div class="group"><h3>Mes versions</h3>
      <div class="fields">${field('slotName', 'Nom de la version', '', { type: 'text', wide: true })}</div>
      <div class="row"><button type="button" class="btn primary" id="slotSave">Enregistrer cette version</button></div>
      ${slots.length ? `<ul class="list">${slots.map((s, i) => `<li><div class="row" style="justify-content:space-between"><span class="nm">${esc(s.name)} <span class="dm">${esc(s.date)}</span></span><span class="row"><button type="button" class="btn small" data-load="${i}">Ouvrir</button><button type="button" class="btn small danger" data-drop="${i}">Supprimer</button></span></div></li>`).join('')}</ul>` : '<p class="note">Aucune version enregistrée. Elles restent dans ce navigateur.</p>'}
    </div>
    <div class="group"><h3>Partager / sauvegarder ailleurs</h3>
      <p class="note">Copiez le code de la maquette pour l’envoyer ou le garder, puis collez-le ici pour la retrouver sur un autre appareil.</p>
      <textarea id="ioText" aria-label="Code de la maquette" placeholder="Collez ici un code de maquette"></textarea>
      <div class="row"><button type="button" class="btn" id="ioCopy">Copier le code</button><button type="button" class="btn" id="ioLoad">Charger le code collé</button><span class="note" id="ioMsg"></span></div>
    </div>
    <div class="group"><h3>Image</h3><div class="row"><button type="button" class="btn" id="shot">Prendre une photo de la maquette</button></div></div>`;
  const pane = $('#paneModels');
  pane.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { pendingPreset = b.dataset.preset; renderModelsPane(); });
  pane.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => { pendingPreset = null; applyPreset(b.dataset.ok); renderModelsPane(); });
  pane.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { pendingPreset = null; renderModelsPane(); });
  $('#slotSave').onclick = () => {
    const name = $('#slotName').value.trim() || `Version ${readSlots().length + 1}`;
    const a = readSlots(); a.unshift({ name, date: new Date().toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }), data: serialize() });
    if (!writeSlots(a)) { $('#slotName').value = 'Stockage indisponible dans ce navigateur'; return; }
    renderModelsPane();
  };
  pane.querySelectorAll('[data-load]').forEach(b => b.onclick = () => { const s = readSlots()[+b.dataset.load]; if (s) loadData(s.data); });
  pane.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => { const a = readSlots(); a.splice(+b.dataset.drop, 1); writeSlots(a); renderModelsPane(); });
  $('#ioCopy').onclick = () => {
    const txt = JSON.stringify(serialize()); const ta = $('#ioText'); ta.value = txt;
    const ok = () => $('#ioMsg').textContent = 'Code copié.';
    const fallback = () => { ta.focus(); ta.select(); $('#ioMsg').textContent = 'Code sélectionné : copiez-le.'; };
    try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (_) { fallback(); }
  };
  $('#ioLoad').onclick = () => {
    try { loadData(JSON.parse($('#ioText').value)); $('#ioMsg').textContent = 'Maquette chargée.'; }
    catch (_) { $('#ioMsg').textContent = 'Ce code n’est pas lisible : recopiez-le en entier.'; }
  };
  $('#shot').onclick = () => {
    const sel = selDeco; if (sel) sel.visible = false;
    renderer.render(scene, camera);
    const url = canvas.toDataURL('image/jpeg', 0.92);
    if (sel) sel.visible = true;
    openModal('Photo de la maquette', url, 'Appui long (téléphone) ou clic droit (ordinateur) pour enregistrer l’image.');
  };
}
function renderPhotosPane() {
  $('#panePhotos').innerHTML = `<div class="group"><h2>Le lieu</h2><p class="lead">Les photos 1 et 5 servent de décor à la maquette (façade et caisses Carrefour). Touchez une photo pour l’agrandir.</p>
    <div class="photos">${IMG.photos.map((src, i) => `<button type="button" data-photo="${i}"><img src="${src}" alt="${esc(PHOTO_CAPTIONS[i])}" loading="lazy"><span>${i + 1}. ${esc(PHOTO_CAPTIONS[i])}</span></button>`).join('')}</div></div>`;
  $('#panePhotos').querySelectorAll('[data-photo]').forEach(b => b.onclick = () => { const i = +b.dataset.photo; openModal(`Photo ${i + 1}`, IMG.photos[i], PHOTO_CAPTIONS[i]); });
}
function openModal(title, src, note) { $('#modalTitle').textContent = title; $('#modalImg').src = src; $('#modalImg').alt = title; $('#modalNote').textContent = note || ''; $('#modal').hidden = false; }
$('#modalClose').onclick = () => $('#modal').hidden = true;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });

/* ---------- Sauvegarde ---------- */
function serialize() { return { v: 2, stand: state.stand, env: state.env, opts: state.opts, items: state.items }; }
let saveTimer = 0;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(serialize())); } catch (_) { } }, 250); }
function loadData(d) {
  if (!d || !Array.isArray(d.items)) throw new Error('format');
  const base = DEFAULT_STATE();
  state = { stand: Object.assign(base.stand, d.stand), env: Object.assign(base.env, d.env), opts: Object.assign(base.opts, d.opts), items: [] };
  nextId = 1;
  for (const raw of d.items) {
    if (!CATALOG[raw.type]) continue;
    const it = makeItem(raw.type, raw);
    it.id = nextId++;
    state.items.push(it);
  }
  selectedId = null;
  buildEnv(); buildStand(); rebuildAll(); select(null); refresh(); save();
  renderStandPane(); setView(viewMode);
}

/* ---------- Boucle de rendu ---------- */
function loop(t) {
  requestAnimationFrame(loop);
  if (tween) {
    const k = Math.min(1, (t - tween.t0) / tween.dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    persp.position.lerpVectors(tween.from.pos, tween.to.pos, e);
    controls.target.lerpVectors(tween.from.tgt, tween.to.tgt, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  ceilingGroup.visible = state.opts.ceiling && camera === persp && persp.position.y < 4.2;
  renderer.render(scene, camera);
}

/* ---------- Démarrage ---------- */
async function start() {
  try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]); } catch (_) { }
  [facadeTex, carrefourTex] = await Promise.all([loadTex(IMG.facade), loadTex(IMG.carrefour)]);
  renderAddPane(); renderPhotosPane(); renderModelsPane();
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (_) { }
  resize();
  buildEnv();
  if (saved && saved.items) { try { loadData(saved); } catch (_) { applyPreset('carre'); } }
  else applyPreset('carre');
  renderStandPane();
  setView('3d', true);
  $('#loading').hidden = true;
  requestAnimationFrame(loop);
}
start();
})();
</script>
